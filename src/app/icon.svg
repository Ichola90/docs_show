<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->t
    <!-- Page Gradients -->
    <linearGradient id="pageLeftGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="85%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="pageRightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="15%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Page Depth Underlay -->
    <linearGradient id="depthGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Bookmark Ribbon Gradient -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- BOOK UNDERLAY (Page Thickness / 3D Depth) -->
  <path d="M 13 44 C 19 43 25 45 32 47.5 C 39 45 45 43 51 44 L 51 46.5 C 45 45.5 39 47.5 32 50 C 25 47.5 19 45.5 13 46.5 Z" fill="#0f172a" opacity="0.45"/>
  <path d="M 13 43 C 19 42 25 44 32 46.5 C 39 44 45 42 51 43 L 51 45 C 45 44 39 46 32 48.5 C 25 46 19 44 13 45 Z" fill="#94a3b8" opacity="0.5"/>

  <!-- LEFT PAGE -->
  <g filter="url(#badgeShadow)">
    <path d="M 32 25 C 26 23 19 21 13 22 L 13 42 C 19 41 26 43 32 45.5 Z" fill="url(#pageLeftGrad)"/>
    <!-- Left chevron < -->
    <path d="M 25 29.5 L 19 33.5 L 25 37.5" stroke="#2563eb" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Code line -->
    <path d="M 18 40.5 H 26" stroke="#93c5fd" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- RIGHT PAGE -->
  <g filter="url(#badgeShadow)">
    <path d="M 32 25 C 38 23 45 21 51 22 L 51 42 C 45 41 38 43 32 45.5 Z" fill="url(#pageRightGrad)"/>
    <!-- Right chevron > -->
    <path d="M 39 29.5 L 45 33.5 L 39 37.5" stroke="#0284c7" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Code line -->
    <path d="M 38 40.5 H 46" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- BOOKMARK RIBBON (Central fold / bookmark) -->
  <path d="M 30.5 16.5 H 33.5 V 33 L 32 31.5 L 30.5 33 Z" fill="url(#ribbonGrad)"/>
  <!-- Gold bookmark bead / accent at top -->
  <circle cx="32" cy="15.5" r="2.2" fill="#fbbf24"/>
  <circle cx="32" cy="15.5" r="1" fill="#ffffff"/>
</svg>